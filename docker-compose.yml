# Startar hela TrAInr: SQL Server, .NET-API:t och React-frontenden.
#   docker compose up -d --build
# Appen: http://localhost:8080  ·  SQL Server (för SSMS): localhost,1433 med användare sa
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-TrAInr_Dev123!}"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: ./backend/TrAInr.Api
    environment:
      ConnectionStrings__Trainr: "Server=sqlserver,1433;Database=TrAInr;User Id=sa;Password=${SA_PASSWORD:-TrAInr_Dev123!};TrustServerCertificate=True"
      Database__MigrateOnStartup: "true"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      Gemini__Model: "${GEMINI_MODEL:-gemini-3.6-flash}"
      Gemini__ThinkingLevel: "${GEMINI_THINKING_LEVEL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      Ai__Provider: "${AI_PROVIDER:-}"
    ports:
      - "5028:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  sqldata:
