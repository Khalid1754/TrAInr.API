<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iPhone: "Lägg till på hemskärmen" i Safari öppnar appen i helskärm med den här ikonen. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TrAInr" />
    <title>TrAInr</title>
    <script>
      // Sätter sparat tema och språk innan sidan ritas, så att den inte blinkar vit i mörkt läge.
      try {
        var theme = localStorage.getItem('trainr-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
        if (localStorage.getItem('trainr-lang') === 'en') document.documentElement.lang = 'en'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
