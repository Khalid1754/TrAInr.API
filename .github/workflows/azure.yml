# Bygger React-appen och .NET-API:t till ett paket och lägger ut det på Azure App Service
# varje gång main uppdateras. Gör ingenting förrän variabeln AZURE_WEBAPP_NAME och
# hemligheten AZURE_WEBAPP_PUBLISH_PROFILE finns i GitHub (se MOLNET.md).
name: Publicera till Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bygg frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Testa och bygg API
        run: |
          dotnet test TrAInr.slnx
          dotnet publish backend/TrAInr.Api -c Release -o publish
          cp -r frontend/dist publish/wwwroot

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
