# Kör alla tester på varje pull request. Publicera till Azure anropar samma tester före varje deploy.
name: Tester

on:
  pull_request:
  workflow_call:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Integrationstesterna startar en riktig SQL Server i Docker (Testcontainers).
      - name: Enhetstester och integrationstester
        run: dotnet test TrAInr.slnx --logger "console;verbosity=normal"

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tester
        run: npm test
      - name: Typkontroll och bygge
        run: npm run build
